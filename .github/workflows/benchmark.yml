name: Benchmark

on:
  push:
    branches: [main]
    paths:
      - '**.cs'
      - '**.csproj'
  pull_request:
    branches: [main]
    paths:
      - '**.cs'
      - '**.csproj'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Delgato.slnx

      - name: Build
        run: dotnet build Delgato.slnx --configuration Release --no-restore

      - name: Run Benchmarks
        run: |
          if [ -d "Delgato.Benchmarks" ]; then
            dotnet run --project Delgato.Benchmarks --configuration Release -- --exporters json --filter '*'
          else
            echo "No benchmark project found. Skipping benchmarks."
            exit 0
          fi

      - name: Store Benchmark Result
        if: github.ref == 'refs/heads/main'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Delgato Benchmarks
          tool: 'benchmarkdotnet'
          output-file-path: BenchmarkDotNet.Artifacts/results/*.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: '@maintainers'
        continue-on-error: true

      - name: Compare with baseline
        if: github.event_name == 'pull_request'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Delgato Benchmarks
          tool: 'benchmarkdotnet'
          output-file-path: BenchmarkDotNet.Artifacts/results/*.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-always: true
          alert-threshold: '150%'
        continue-on-error: true
